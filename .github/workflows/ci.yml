# Builds the library and runs the sample on every push and pull request.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build AdvancedRagdoll.csproj -c Release
      - run: dotnet run --project tests/LibrarySample -c Release
      - run: dotnet pack AdvancedRagdoll.csproj -c Release -o artifacts
