# Publishes the package to nuget.org when a version tag (v0.1.0-beta.1, v0.2.0, ...) is pushed.
# Uses NuGet Trusted Publishing: no API key is stored anywhere. nuget.org trusts this repository's
# workflow file `publish.yml` in the environment `release` (a Trusted Publishing policy on the
# nuget.org account); the job exchanges GitHub's short-lived OIDC token for a one-hour NuGet key.
# Needs the repository secret NUGET_USER (the nuget.org user name, not the e-mail address).
name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build AdvancedRagdoll.csproj -c Release -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.value }}

      - name: Sample
        run: dotnet run --project tests/LibrarySample -c Release

      - name: Pack
        run: dotnet pack AdvancedRagdoll.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.value }} -o artifacts

      - name: NuGet login (OIDC to a temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
